# 接続先はすべて DATABASE_URL で指定する。
# 開発・テストの既定値は docker-compose.yml の PostgreSQL（localhost:5433）。
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://postgres:postgres@localhost:5433/enje_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://postgres:postgres@localhost:5433/enje_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
