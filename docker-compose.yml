services:
  db:
    image: postgres:16-alpine
    container_name: enje-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enje_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - enje-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  enje-db:
